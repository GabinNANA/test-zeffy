<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faites un don</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4CAF50;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    .iframe-container {
      position: relative;
      overflow: hidden;
      height: 1200px;
      width: 100%;
    }

    .iframe-container iframe {
      position: absolute;
      border: 0;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Soutenez notre cause</h1>
  </header>

  <main>
    <p>Faites un don pour aider notre mission. Merci pour votre générosité !</p>
    <div class="iframe-container">
      <iframe 
        title="Donation form powered by Zeffy"
        src="https://www.zeffy.com/embed/donation-form/un-toit-pour-elles-faites-un-don-changez-une-vie"
        allowpaymentrequest
        allowTransparency="true">
      </iframe>
    </div>
  </main>
</body>
</html>
